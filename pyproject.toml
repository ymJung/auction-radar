[project]
name = "auction-radar"
version = "1.0.0"
description = "경매 매력매물 필터링(임차인無·소유자거주·권리하자無·미납관리비) + 6대 부동산 사이트 교차분석 + 낙찰가 추적 및 입찰가 추천 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
